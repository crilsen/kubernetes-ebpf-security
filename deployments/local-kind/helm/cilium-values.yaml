# Cilium values for the kind target. Version is pinned by scripts/local-up.sh.
cluster:
  name: ebpf-lab
# Replace kube-proxy with Cilium's eBPF implementation so service traffic is
# visible to policy. The API server endpoint must be set for kind.
kubeProxyReplacement: true
k8sServiceHost: ebpf-lab-control-plane
k8sServicePort: 6443
ipam:
  mode: kubernetes
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
operator:
  replicas: 1
# Keep the local footprint small.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
