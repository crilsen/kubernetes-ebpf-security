apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: ebpf-lab
type: Opaque
stringData:
  # Demo-only credential. Never reuse it outside this lab.
  POSTGRES_USER: lab
  POSTGRES_PASSWORD: lab-demo-password
  POSTGRES_DB: lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ebpf-lab
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS demo_messages (
        id   SERIAL PRIMARY KEY,
        body TEXT NOT NULL
    );

    INSERT INTO demo_messages (body)
    VALUES ('Hello from PostgreSQL inside the eBPF security lab')
    ON CONFLICT DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ebpf-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubernetes-ebpf-security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kubernetes-ebpf-security
        ebpf-lab.io/observe: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lab", "-d", "lab"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lab", "-d", "lab"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ebpf-lab
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: kubernetes-ebpf-security
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
